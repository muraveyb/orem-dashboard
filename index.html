<title>Вывод потребителей на ОРЭМ</title>
<style>
  /* Обновленная темная цветовая схема */
  :root{
    --bg:#121212; /* Темно-серый, почти черный фон */
    --panel:#1E1E1E; /* Чуть более светлый фон для панелей и карточек */
    --panel-2:#2C2C2C; /* Еще светлее для ховеров и выделений */
    --border:#333333; /* Темные границы */
    --border-strong:#555555; /* Более заметные границы */
    --ink:#E0E0E0; /* Светло-серый текст */
    --ink-2:#AAAAAA; /* Серый текст (второстепенный) */
    --ink-3:#777777; /* Темно-серый текст (подписи, неактивные элементы) */
    
    /* Акцентные цвета, адаптированные для темного фона */
    --accent:#81C784; /* Светло-зеленый акцент */
    --accent-soft: rgba(129, 199, 132, 0.1); /* Прозрачный акцент */
    
    /* Статусы документов */
    --done:#66BB6A; /* Зеленый (выполнено) */
    --done-soft: rgba(102, 187, 106, 0.1); /* Прозрачный зеленый */
    --progress:#FFB74D; /* Оранжевый (в процессе) */
    --idle:#555555; /* Серый (не начато) */
    
    /* Цвета для разных стадий плашек */
    --danger-soft:#2C1A1A; /* Очень темно-красный фон (Стадия 1) */
    --danger-soft-border:#EF9A9A; /* Светло-красная граница */
    --danger:#EF5350; /* Красный текст/выделение */
    
    --stage2-bg:#3E2723; /* Темно-коричневый/красный фон (Стадия 2) */
    --stage2-border:#E57373; /* Более насыщенная красная граница */
    
    --stage3-bg:#1A2E2C; /* Темно-бирюзовый фон (Стадия 3) */
    --stage3-border:#4DB6AC; /* Светло-бирюзовая граница */
    --stage3-text:#80CBC4; /* Бирюзовый текст */
    
    --radius:10px;
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
    --sans: -apple-system, "Inter", "Segoe UI", sans-serif;
  }
  
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans); color-scheme: dark;}
  body{padding:28px 32px 60px;max-width:1800px;margin:0 auto;}
  
  /* Стили для шапки с логотипом */
  .header-area {display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; gap: 20px;}
  .header-left {display: flex; align-items: center; gap: 15px;}
  .company-logo {height: 120px; width: auto; display: block;}
  
  h1{font-size:19px;font-weight:600;letter-spacing:-0.01em;margin:0 0 2px; color: #FFFFFF;}
  .sub{font-size:13px;color:var(--ink-2);margin:0;}
  .sub .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--done);margin-right:6px;vertical-align:1px;}

  /* Стиль главной кнопки сохранения */
  .main-save-btn {font-family:var(--sans); font-size:13px; font-weight:600; color:#121212; background:var(--done); border:none; border-radius:8px; padding:8px 14px; cursor:pointer; display:flex; align-items:center; gap:6px; transition: background 0.15s;}
  .main-save-btn:hover {background:#81C784;}

  /* Вкладки компаний */
  .companytabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--border);}
  .ctab{font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--ink-3);background:none;border:none;padding:9px 4px;margin-right:22px;cursor:pointer;border-bottom:2px solid transparent;transition:color .15s;}
  .ctab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .ctab:hover{color:var(--ink);}

  /* Блоки КПЭ */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px;}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
  .kpi .num{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums; color: #FFFFFF;}
  .kpi .lbl{font-size:11.5px;color:var(--ink-2);margin-top:2px;}

  /* Секции */
  .section{margin-bottom:30px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .section-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);}
  .addbtn{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--accent);background:var(--accent-soft);border:none;border-radius:7px;padding:6px 11px;cursor:pointer; transition: background 0.1s;}
  .addbtn:hover{background: rgba(129, 199, 132, 0.2);}

  /* Плашки ОРЭМ — сетка квадратных карточек на весь экран */
  .orem-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));gap:12px;}
  .orem-tile{position:relative;aspect-ratio:1/1;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;user-select:none;display:flex;flex-direction:column;justify-content:space-between;transition:background .15s, border-color .15s, transform .1s;}
  .orem-tile:hover{background:var(--panel-2);border-color:var(--border-strong);transform:translateY(-2px);}
  .orem-tile .tile-top{display:flex;justify-content:flex-end;gap:4px;}
  .orem-tile .tile-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;}
  .orem-tile .name{font-weight:600;font-size:14.5px;color:#FFFFFF;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .orem-tile .code{font-size:11.5px;color:var(--accent);font-family:var(--mono);word-break:break-all;}
  .orem-tile .meta{color:var(--ink-2);font-size:11.5px;font-family:var(--mono);}
  .orem-tile .su-indicator{margin-top:auto;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;display:inline-block;align-self:flex-start;}
  .orem-tile .su-indicator.has-su{background:var(--done-soft);color:var(--done);}
  .orem-tile .su-indicator.no-su{background:var(--panel-2);color:var(--ink-3);border:1px solid var(--border);}

  /* Модалка детального просмотра плашки ОРЭМ */
  .su-table{width:100%;border-collapse:collapse;margin-top:8px;background:var(--panel);}
  .su-table th, .su-table td{text-align:left;padding:7px 10px;border:1px solid var(--border);font-size:12px;}
  .su-table th{background:var(--bg);color:var(--ink-2);font-weight:600;}

  /* Карточки "В процессе" */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;transition:all 0.2s;}

  /* Крупные квадратные плашки "В процессе" (вкладка ССК-Инвест) */
  .process-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));gap:16px;}
  .process-grid .card{min-height:350px;margin-bottom:0;display:flex;flex-direction:column;overflow-y:auto;position:relative;border-color:#E53935;animation:urgentPulse 2.2s ease-in-out infinite;}
  .process-grid .card .docs{flex-grow:0;overflow-y:auto;padding-bottom:10px;border-bottom:1px solid var(--border);}
  .process-grid .card .notes{flex-grow:1;overflow-y:auto;margin-top:10px;}
  .process-grid .card-top-grid{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .process-grid .card-name-grid{font-size:15px;font-weight:700;color:#FFFFFF;line-height:1.4;margin-bottom:10px;}
  .process-grid .urgent-tag{position:absolute;top:10px;left:14px;font-size:10.5px;font-weight:800;color:#fff;background:#E53935;padding:3px 9px;border-radius:6px;letter-spacing:.04em;z-index:1;}
  @keyframes urgentPulse{0%,100%{box-shadow:0 0 0 1px rgba(229,57,53,.25);}50%{box-shadow:0 0 16px 3px rgba(229,57,53,.5);}}
  
  /* Стадии плашек */
  .card.stage-1{background:var(--danger-soft);border-color:var(--danger-soft-border);}
  .card.stage-2{background:var(--stage2-bg);border-color:var(--stage2-border);}
  .card.stage-3{background:var(--stage3-bg);border-color:var(--stage3-border);}

  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px;gap:8px;}
  .card-name{font-size:14px;font-weight:600;line-height:1.45; color: #FFFFFF;}
  .consumption-line{font-size:12.5px;color:var(--ink-2);margin:-2px 0 9px;}
  .consumption-line strong{color:var(--accent);font-family:var(--mono);font-weight:600;}
  
  .badge-stop{display:inline-block;background:#E59866;color:#121212;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:1px;}
  
  /* Бейджи статусов */
  .badge-status{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;margin-left:8px;vertical-align:middle;line-height:1.3; color: #121212;}
  .badge-status.s1{background:var(--danger);}
  .badge-status.s2{background:#E57373;}
  .badge-status.s3{background:var(--stage3-border); color: var(--bg);}
  
  .card-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}

  /* Круговая диаграмма процента выполнения */
  .progress-ring{flex-shrink:0;}
  .progress-ring .ring-track{fill:none;stroke:var(--bg);}
  .progress-ring .ring-fill{fill:none;stroke-linecap:round;transition:stroke-dashoffset .3s;}
  .progress-ring .ring-text{font-family:var(--sans);font-weight:700;font-variant-numeric:tabular-nums;}
  
  
  /* Чипсы документов */
  .docs{display:flex;flex-wrap:wrap;gap:6px;}
  .doc-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:4px 8px;cursor:pointer;user-select:none;transition:all 0.1s;}
  .doc-chip:hover{border-color:var(--border-strong); background: #333333;}
  .doc-chip.is-done{background:var(--done-soft);border-color:var(--done);color:var(--done);}
  .dot{width:7px;height:7px;border-radius:2px;flex-shrink:0;}
  
  /* Примечания */
  .notes{margin-top:10px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--border);padding-top:8px;}
  .notes div{margin-top:2px;line-height:1.4;}

  /* Кнопки-иконки */
  .iconbtn{width:24px;height:24px;border-radius:6px;border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center; transition: all 0.1s;}
  .iconbtn:hover{background: rgba(239, 83, 80, 0.1); color:var(--danger);}
  .iconbtn.edit-btn:hover{background: var(--accent-soft); color:var(--accent);}

  .empty{color:var(--ink-3);font-size:13px;padding:14px 2px;}

  /* Алерт истечения Акта СУ */
  .expiry-alert{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:6px;line-height:1.3;}
  .expiry-alert.expiry-warn{background:rgba(255,183,77,0.15);color:var(--progress);border:1px solid rgba(255,183,77,0.4);}
  .expiry-alert.expiry-danger{background:rgba(239,83,80,0.15);color:var(--danger);border:1px solid rgba(239,83,80,0.4);}
  .orem-tile .tile-top{justify-content:space-between;align-items:flex-start;}
  .orem-tile .tile-top .tile-top-alert{flex:1;min-width:0;}
  .orem-tile .tile-top .tile-top-icons{display:flex;gap:4px;flex-shrink:0;}

  /* Панель поиска и фильтров */
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .search-input{font-family:var(--sans);font-size:12.5px;padding:6px 10px;border:1px solid var(--border-strong);border-radius:7px;background:var(--bg);color:var(--ink);min-width:200px;}
  .search-input::placeholder{color:var(--ink-3);}
  .filter-select{font-family:var(--sans);font-size:12.5px;padding:6px 9px;border:1px solid var(--border-strong);border-radius:7px;background:var(--bg);color:var(--ink);cursor:pointer;}
  .sortbtn{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink);background:var(--panel-2);border:1px solid var(--border-strong);border-radius:7px;padding:6px 11px;cursor:pointer;white-space:nowrap;transition:background .1s;}
  .sortbtn:hover{background:#333333;}
  .sortbtn.active{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}

  /* Модальные окна */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:var(--panel);border-radius:14px;padding:20px;width:420px;max-width:92vw;box-shadow:0 20px 50px rgba(0,0,0,.5); border: 1px solid var(--border);}
  .modal h3{margin:0 0 14px;font-size:15px;font-weight:600; color: #FFFFFF;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;}
  .field input, .field select, .field textarea{width:100%;font-family:var(--sans);font-size:13.5px;padding:8px 9px;border:1px solid var(--border-strong);border-radius:7px;background:var(--bg);color:var(--ink);}
  .field textarea{resize:vertical;min-height:90px;}
  .field.checkbox{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .field.checkbox input{width:auto;}
  .field.checkbox label{margin-bottom:0;cursor:pointer;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .btn{font-family:var(--sans);font-size:13px;font-weight:500;padding:7px 14px;border-radius:7px;border:1px solid var(--border-strong);background:var(--panel-2);color:var(--ink);cursor:pointer; transition: background 0.1s;}
  .btn:hover {background: #333333;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#121212;}
  .btn.primary:hover{background:#81C784;}

  /* Хинт сохранения */
  .savehint{position:fixed;bottom:16px;right:16px;font-size:11.5px;color:var(--done);background:var(--panel);border:1px solid var(--border);padding:5px 10px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100; box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
  .savehint.show{opacity:1;}
</style>

function setSyncStatus(status) {

  indicator.textContent = s.text;
  indicator.style.color = s.color;
}

function isDone(status){
  if(!status) return false;
  const s = String(status).trim().toLowerCase();
  return s === 'да' || s === 'согласован' || s === 'выполнено' || s === 'true';
}

function uid(){ return 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function checkStage1(p) {
  if (!p.documents) return false;
  return STAGE_1_DOCS.every(name => {
    const d = p.documents.find(doc => doc.doc === name);
    return d && isDone(d.status);
  });
}

function checkStage2(p) {
  if (!p.documents) return false;
  return STAGE_2_DOCS.every(name => {
    const d = p.documents.find(doc => doc.doc === name);
    return d && isDone(d.status);
  });
}

function checkStage3(p) {
  if (!p.documents) return false;
  const d = p.documents.find(doc => doc.doc === 'Заявление на допуск к торгам');

}

function migrateDocs(projects){
  projects.forEach(p=>{
    if(p.status === 'in_process'){
      if(!p.documents) p.documents = [];
      DOC_ORDER.forEach(name=>{
        if(!p.documents.find(d=>d.doc === name)){
          p.documents.push({doc:name, status:'нет'});
        }
      });
    }
  });
  return projects;
}

let saveDirHandle = null;
const FS_SUPPORTED = typeof window.showDirectoryPicker === 'function';

function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open('orem-fs-handles', 1);
    req.onupgradeneeded = () => { if(!req.result.objectStoreNames.contains('handles')) req.result.createObjectStore('handles'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('handles','readonly');
    const r = tx.objectStore('handles').get(key);
    r.onsuccess = () => resolve(r.result || null);
    r.onerror = () => reject(r.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function updateDirLabel(){

async function initSaveDir(){
  if(!FS_SUPPORTED) return;
  try{
    const stored = await idbGet('saveDir');
    if(stored){
      const perm = await stored.queryPermission({mode:'readwrite'});
      if(perm === 'granted'){
        saveDirHandle = stored;
      }
      // if 'prompt', we keep handle but will re-request permission on next save
      else if(perm === 'prompt'){
        saveDirHandle = stored;
      }
    }
  }catch(e){ console.error('initSaveDir error', e); }
  updateDirLabel();
}

async function ensureSaveDirHandle(forcePick){
  if(!FS_SUPPORTED) return null;
  if(!forcePick && saveDirHandle){
    try{
      let perm = await saveDirHandle.queryPermission({mode:'readwrite'});
      if(perm !== 'granted'){
        perm = await saveDirHandle.requestPermission({mode:'readwrite'});
      }
      if(perm === 'granted') return saveDirHandle;
      // разрешение реально отклонено (не ошибка, а осознанный отказ) — просим выбрать папку заново
    }catch(e){
      console.error('permission check error', e);
      // сохранённый handle стал невалидным (например, папка удалена/перемещена) — просим выбрать заново вместо тихого падения
    }
    saveDirHandle = null;
    updateDirLabel();
  }
  try{
    const handle = await window.showDirectoryPicker({mode:'readwrite'});
    saveDirHandle = handle;
    await idbSet('saveDir', handle);
    updateDirLabel();
    return handle;
  }catch(e){
    if(e && e.name === 'AbortError') return null; // пользователь сам закрыл диалог выбора папки — это не ошибка
    console.error('showDirectoryPicker error', e);
    throw e; // настоящая ошибка (например, SecurityError) — пусть её увидит вызывающий код и покажет пользователю
  }
}

let saveTimer;
async function saveState(){
  try{
    if (supabaseClient && syncStatus !== 'offline') {
      setSyncStatus('syncing');
      
      // Фильтруем данные - отправляем только нужные поля
      const dataToSave = state.projects.map(p => {
        const filtered = {
          id: p.id,
          company: p.company,
          status: p.status,
          name: p.name
        };
        
        // Поля для on_orem
        if (p.status === 'on_orem') {
          filtered.code = p.code || null;
          filtered.psi = p.psi || null;
          filtered.date_on = p.date_on || null;
          filtered.open = p.open || false;
          filtered.su_data = (p.su_data && p.su_data.length > 0) ? p.su_data : null;
        }
        
        // Поля для in_process
        if (p.status === 'in_process') {
          filtered.on_stop = p.on_stop || false;
          filtered.documents = (p.documents && p.documents.length > 0) ? p.documents : null;
          filtered.notes = (p.notes && p.notes.length > 0) ? p.notes : null;
          filtered.consumption = p.consumption || null;
        }
        
        return filtered;
      });
      
      console.log('📤 Отправляю', dataToSave.length, 'объектов в Supabase');
      console.log('Первый объект:', dataToSave[0]);
      
      const { error, data } = await supabaseClient.from('projects').upsert(dataToSave, { onConflict: 'id' });
      
      console.log('📥 Response от Supabase:', { error, data });
      
      if (error) {
        console.error('❌ Supabase error:', error);
        throw error;
      }
      setSyncStatus('synced');
      console.log('✓ Данные сохранены на сервер');
      showFlashHint('Сохранено на сервер');
    } else {
      console.log('📝 Сохраняю в localStorage (offline)');
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.projects));
      setSyncStatus('offline');
      showFlashHint('Сохранено в браузере (offline)');
    }
  }catch(e) {
    console.error('❌ Ошибка сохранения:', e);
    showFlashHint('Ошибка сохранения!');
    setSyncStatus('offline');
  }
}

async function importFromBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    
    if (!Array.isArray(data)) {
      showFlashHint('❌ Неверный формат файла');
      return;
    }
    
    state.projects = ensureInvestData(migrateDocs(data));
    await saveState();
    showFlashHint(`✓ Загружено ${data.length} объектов`);
    render();
  } catch(e) {
    showFlashHint(`❌ Ошибка: ${e.message}`);
    console.error('Ошибка импорта:', e);
  }
  
  event.target.value = '';
}

function ringColor(pct){
  if (pct >= 70) return '#00E676'; // яркий зелёный
  if (pct >= 40) return '#FFC400'; // яркий янтарный
  return '#FF5252'; // яркий красный
}

function progressRingSvg(pct){
  const size = 46, stroke = 5, r = (size - stroke) / 2, cx = size / 2, cy = size / 2;
  const circumference = 2 * Math.PI * r;
  const offset = circumference * (1 - pct / 100);
  const color = ringColor(pct);
  return `
    <svg class="progress-ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="ring-track" cx="${cx}" cy="${cy}" r="${r}" stroke-width="${stroke}"></circle>
      <circle class="ring-fill" cx="${cx}" cy="${cy}" r="${r}" stroke-width="${stroke}"
        stroke="${color}" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
        transform="rotate(-90 ${cx} ${cy})"></circle>
      <text class="ring-text" x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central"
        font-size="12.5" fill="${color}">${pct}%</text>
    </svg>
  `;
}

function todayStr(){ return new Date().toISOString().slice(0,10); }

function daysSince(dateStr){
  if(!dateStr) return null;
  const then = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const diff = Math.floor((now - then) / (1000*60*60*24));
  return diff >= 0 ? diff : 0;
}

function waitingBadgeHtml(p){
  const days = daysSince(p.lastUpdate);
  if(days === null) return '';
  let color = 'var(--ink-3)';
  if(days >= 14) color = 'var(--danger)';
  else if(days >= 7) color = 'var(--progress)';
  const label = days === 0 ? 'сегодня' : `${days} ${dayWord(days)}`;
  return `<span class="waiting-badge" style="font-size:11px;color:${color};white-space:nowrap;" title="Дата последнего изменения: ${escapeHtml(formatDate(p.lastUpdate))}">на этапе: ${label}</span>`;
}

function dayWord(n){
  const n10 = n % 10, n100 = n % 100;
  if(n100 >= 11 && n100 <= 14) return 'дней';
  if(n10 === 1) return 'день';
  if(n10 >= 2 && n10 <= 4) return 'дня';
  return 'дней';
}

function formatDate(dateStr){
  if(!dateStr) return '—';
  const [y,m,d] = dateStr.split('-');
  return `${d}.${m}.${y}`;
}

function parseRuDate(str){
  if(!str || str === '—') return null;
  const parts = String(str).trim().split('.');
  if(parts.length !== 3) return null;
  const d = parseInt(parts[0],10), m = parseInt(parts[1],10), y = parseInt(parts[2],10);
  if(!d || !m || !y) return null;
  const dt = new Date(y, m-1, d);
  return isNaN(dt.getTime()) ? null : dt;
}

function daysUntil(dateStr){
  const d = parseRuDate(dateStr);
  if(!d) return null;
  const now = new Date();
  now.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  return Math.round((d - now) / (1000*60*60*24));
}

// Наименьший остаток дней до истечения среди всех записей Акта СУ объекта (null, если данных нет)
function earliestActExpiryDays(p){
  if(!p.su_data || !p.su_data.length) return null;
  let min = null;
  p.su_data.forEach(su=>{
    const days = daysUntil(su.date);
    if(days !== null && (min === null || days < min)) min = days;
  });
  return min;
}

function expiryAlertHtml(days){
  if(days === null) return '';
  if(days < 0){
    return `<span class="expiry-alert expiry-danger" title="Срок действия Акта СУ истёк">⚠ Акт СУ истёк ${Math.abs(days)} дн. назад</span>`;
  }
  if(days <= 90){
    const cls = days <= 30 ? 'expiry-danger' : 'expiry-warn';
    return `<span class="expiry-alert ${cls}" title="Срок действия Акта СУ скоро истекает">⚠ Акт СУ истекает через ${days} ${dayWord(days)}</span>`;
  }
  return '';
}

function fmtKwh(n){
  const num = Number(n);
  if(isNaN(num)) return escapeHtml(String(n));
  return num.toLocaleString('ru-RU');
}

function progressPct(p){
  if(!p.documents || !p.documents.length) return 0;
  const doneCount = p.documents.filter(d=>isDone(d.status)).length;
  return Math.round(100*doneCount/p.documents.length);
}

function render(){
  renderTabs();
  renderKpis();
  renderOrem();
  renderProcess();
}

function renderTabs(){
  const el = document.getElementById('companytabs');
  el.innerHTML = '';
  COMPANIES.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'ctab' + (c===state.activeCompany ? ' active' : '');
    b.innerHTML = COMPANY_TAB_LABELS[c] || c;
    b.addEventListener('click', ()=>{ state.activeCompany = c; render(); });
    el.appendChild(b);
  });
}

function renderKpis(){
  const list = state.projects.filter(p=>p.company===state.activeCompany);
  const onOrem = list.filter(p=>p.status==='on_orem').length;
  const inProc = list.filter(p=>p.status==='in_process');
  const onStop = inProc.filter(p=>p.on_stop).length;
  const avg = inProc.length ? Math.round(inProc.reduce((s,p)=>s+progressPct(p),0)/inProc.length) : 0;
  const el = document.getElementById('kpis');
  el.innerHTML = `
    <div class="kpi"><div class="num">${list.length}</div><div class="lbl">всего объектов</div></div>
    <div class="kpi"><div class="num">${onOrem}</div><div class="lbl">на ОРЭМ</div></div>
    <div class="kpi"><div class="num">${inProc.length}</div><div class="lbl">в процессе</div></div>
    <div class="kpi"><div class="num">${onStop}</div><div class="lbl">на стопе${avg?` · сред. прогресс ${avg}%`:''}</div></div>
  `;
}

function renderOrem(){
  const el = document.getElementById('oremlist');
  const sortBtn = document.getElementById('oremSortBtn');
  sortBtn.classList.toggle('active', state.oremSortByExpiry);

  const totalForCompany = state.projects.filter(p=>p.company===state.activeCompany && p.status==='on_orem');
  const q = state.oremSearch.trim().toLowerCase();
  let list = totalForCompany.filter(p=>{
    if(!q) return true;
    return (p.name && p.name.toLowerCase().includes(q)) || (p.code && p.code.toLowerCase().includes(q));
  });

  if(state.oremSortByExpiry){
    list = list.slice().sort((a,b)=>{
      const da = earliestActExpiryDays(a), db = earliestActExpiryDays(b);
      if(da === null && db === null) return 0;
      if(da === null) return 1;   // без даты — в конец
      if(db === null) return -1;
      return da - db;             // сначала те, кто скоро истекает / уже истёк
    });
  }

  el.innerHTML = '';
  if(!list.length){
    el.innerHTML = `<div class="empty">${totalForCompany.length ? 'ничего не найдено по запросу' : 'пока нет объектов на ОРЭМ в этой компании'}</div>`;
    return;
  }

  list.forEach(p=>{
    const hasSu = p.su_data && p.su_data.length > 0;
    const expDays = earliestActExpiryDays(p);
    const alertHtml = expiryAlertHtml(expDays);
    const tile = document.createElement('div');
    tile.className = 'orem-tile';

    tile.innerHTML = `
      <div class="tile-top">
        <span class="tile-top-alert">${alertHtml}</span>
        <span class="tile-top-icons">
          <button class="iconbtn edit-btn" title="Редактировать">✎</button>
          <button class="iconbtn del-btn" title="Удалить">✕</button>
        </span>
      </div>
      <div class="tile-body">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="code">${escapeHtml(p.code)}</div>
        <div class="meta">ПСИ: ${escapeHtml(p.psi)} · ${escapeHtml(p.date_on)}</div>
      </div>
      <span class="su-indicator ${hasSu ? 'has-su' : 'no-su'}">${hasSu ? '✓ Акт СУ есть' : 'Акт СУ не указан'}</span>
    `;

    tile.addEventListener('click', (e)=>{
      if (e.target.closest('.del-btn') || e.target.closest('.edit-btn')) return;
      openOremDetailsModal(p.id);
    });

    tile.querySelector('.del-btn').addEventListener('click', (e)=>{ e.stopPropagation(); removeProject(p.id); });
    tile.querySelector('.edit-btn').addEventListener('click', (e)=>{ e.stopPropagation(); openEditOremModal(p.id); });
    el.appendChild(tile);
  });
}

function renderProcess(){
  const el = document.getElementById('processlist');
  el.className = (state.activeCompany === 'ССК-Инвест') ? 'process-grid' : '';
  const totalForCompany = state.projects.filter(p=>p.company===state.activeCompany && p.status==='in_process');
  const q = state.processSearch.trim().toLowerCase();
  const stageFilter = state.processStageFilter;

  const list = totalForCompany.filter(p=>{
    if(q && !(p.name && p.name.toLowerCase().includes(q))) return false;
    if(stageFilter === 'on_stop') return !!p.on_stop;
    if(stageFilter === 'stage1') return effectiveStage(p) === 1;
    if(stageFilter === 'stage2') return effectiveStage(p) === 2;
    if(stageFilter === 'stage3') return effectiveStage(p) === 3;
    return true; // 'all'
  }).sort((a,b)=>progressPct(b)-progressPct(a));

  el.innerHTML = '';
  if(!list.length){
    el.innerHTML = `<div class="empty">${totalForCompany.length ? 'ничего не найдено по заданным условиям' : 'нет объектов в процессе вывода в этой компании'}</div>`;
    return;
  }
  
  list.forEach(p=>{
    const pct = progressPct(p);
    
    const s3 = checkStage3(p);
    const s2 = checkStage2(p);
    const s1 = checkStage1(p);
    
    let cardClass = 'card';
    let statusBadgeHtml = '';
    
    if (s3) {
      cardClass = 'card stage-3';
      statusBadgeHtml = '<span class="badge-status s3">Получен Акт СУ</span>';
    } else if (s2) {
      cardClass = 'card stage-2';
      statusBadgeHtml = '<span class="badge-status s2">Подано заявление в АО "АТС" на проведение испытаний для Акта СУ</span>';
    } else if (s1) {
      cardClass = 'card stage-1';
      statusBadgeHtml = '<span class="badge-status s1">Документы поданы в АО "АТС" на экспертизу ПСИ</span>';
    }
    
    const card = document.createElement('div');
    card.className = cardClass;
    
    const docsHtml = (p.documents||[]).map((d,i)=>{
      const done = isDone(d.status);
      const dateTitle = done && d.date ? `Отмечено: ${formatDate(d.date)}` : '';
      return `<span class="doc-chip ${done ? 'is-done' : ''}" data-idx="${i}" ${dateTitle ? `title="${escapeHtml(dateTitle)}"` : ''}>
        <span class="dot" style="background:${done ? 'var(--done)' : 'var(--idle)'}"></span>
        ${escapeHtml(d.doc)}
      </span>`;
    }).join('');
    
    const notesHtml = (p.notes && p.notes.length) ? `<div class="notes">${p.notes.map(n=>`<div>· ${escapeHtml(n)}</div>`).join('')}</div>` : '';
    const consumptionHtml = (p.consumption !== null && p.consumption !== undefined && p.consumption !== '')
      ? `<div class="consumption-line">⚡ Объём потребления: <strong>${fmtKwh(p.consumption)} кВт·ч</strong></div>`
      : '';
    
    const isGrid = (state.activeCompany === 'ССК-Инвест');
    
    if(isGrid){
      card.innerHTML = `
        <div class="urgent-tag">🔥 СРОЧНО</div>
        <div class="card-top-grid">
          <span class="card-right">
            ${waitingBadgeHtml(p)}
            ${progressRingSvg(pct)}
            <button class="iconbtn edit-btn" title="Редактировать">✎</button>
            <button class="iconbtn del-btn" title="Удалить">✕</button>
          </span>
        </div>
        <div class="card-name-grid">
          ${escapeHtml(p.name)}
          ${p.on_stop ? '<span class="badge-stop">на стопе</span>' : ''}
          ${statusBadgeHtml}
        </div>
        ${consumptionHtml}
        <div class="docs">${docsHtml}</div>
        ${notesHtml}
      `;
    } else {
      card.innerHTML = `
        <div class="card-top">
          <span class="card-name">
            ${escapeHtml(p.name)}
            ${p.on_stop ? '<span class="badge-stop">на стопе</span>' : ''}
            ${statusBadgeHtml}
          </span>
          <span class="card-right">
            ${waitingBadgeHtml(p)}
            ${progressRingSvg(pct)}
            <button class="iconbtn edit-btn" title="Редактировать">✎</button>
            <button class="iconbtn del-btn" title="Удалить">✕</button>
          </span>
        </div>
        ${consumptionHtml}
        <div class="docs">${docsHtml}</div>
        ${notesHtml}
      `;
    }
    
    card.querySelector('.del-btn').addEventListener('click', ()=>removeProject(p.id));
    card.querySelector('.edit-btn').addEventListener('click', ()=>openEditModal(p.id));
    
    card.querySelectorAll('.doc-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const idx = parseInt(chip.dataset.idx,10);
        const currentStatus = p.documents[idx].status;
        const nowDone = !isDone(currentStatus);
        
        p.documents[idx].status = nowDone ? 'да' : 'нет';
        p.documents[idx].date = nowDone ? todayStr() : null;
        p.lastUpdate = todayStr();
        
        saveState();
        renderProcess();
        renderKpis();
      });
    });
    el.appendChild(card);
  });
}

function removeProject(id){
  if(!confirm('Удалить этот объект из дашборда?')) return;
  console.log('🗑️ Удаляю объект', id);
  
  // Сначала удаляем из Supabase если подключен
  if (supabaseClient && syncStatus !== 'offline') {
    supabaseClient.from('projects').delete().eq('id', id)
      .then(res => {
        if (res.error) {
          console.error('❌ Ошибка удаления в Supabase:', res.error);
        } else {
          console.log('✓ Объект удалён из Supabase');
        }
      });
  }
  
  // Потом удаляем локально
  state.projects = state.projects.filter(p=>p.id!==id);
  console.log('📊 Осталось объектов:', state.projects.length);
  render();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

        </div>
        <div class="field">
          <label>Примечания (каждое примечание с новой строки)</label>
          <textarea id="f-notes" placeholder="Введите примечания...">${escapeHtml(notesText)}</textarea>
        </div>
        <div class="modal-actions">
          <button class="btn" id="f-cancel">Отмена</button>
          <button class="btn primary" id="f-save">Сохранить изменения</button>
        </div>
      </div>
    </div>
  `;
  
  document.getElementById('f-cancel').addEventListener('click', ()=>root.innerHTML='');
  document.getElementById('f-save').addEventListener('click', ()=>{
    const name = document.getElementById('f-name').value.trim();
    if(!name){ document.getElementById('f-name').focus(); return; }
    
    p.name = name;
    p.on_stop = document.getElementById('f-stop').checked;
    
    const consumptionRaw = document.getElementById('f-consumption').value.trim();
    p.consumption = consumptionRaw ? parseFloat(consumptionRaw) : null;
    
    const notesRaw = document.getElementById('f-notes').value;
    p.notes = notesRaw.split('\n').map(n => n.trim()).filter(n => n.length > 0);
    
    root.innerHTML = '';
    saveState();
    render();
  });
}

initSupabase();
loadState();
initSaveDir();
