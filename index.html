<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вывод потребителей на ОРЭМ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Темная тема */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 20px;
  }
  .header-area {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding: 15px;
    background: #2a2a2a;
    border-radius: 8px;
  }
  .logo { font-size: 24px; font-weight: bold; }
  .sync-indicator {
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 4px;
    background: #333;
  }
  .sync-online { color: #66BB6A; }
  .sync-offline { color: #EF5350; }
  .sync-syncing { color: #FFC400; }
  button {
    padding: 10px 20px;
    margin: 5px;
    background: #2196F3;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: #1976D2; }
  .main-container { max-width: 1200px; margin: 0 auto; }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
  .card {
    background: #2a2a2a;
    padding: 15px;
    border-radius: 8px;
    border-left: 4px solid #2196F3;
  }
  .card-title { font-weight: bold; margin-bottom: 10px; }
  .card-status { font-size: 12px; color: #999; }
  .flash-hint {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: #2196F3;
    color: white;
    padding: 15px 20px;
    border-radius: 4px;
    max-width: 400px;
  }
  .companies-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    border-bottom: 1px solid #333;
  }
  .tab {
    padding: 10px 15px;
    background: none;
    border: none;
    color: #999;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab.active {
    color: #2196F3;
    border-bottom-color: #2196F3;
  }
</style>
</head>
<body>

<div class="main-container">
  <div class="header-area">
    <div>
      <div class="logo">ССК ОРЭМ</div>
      <div style="font-size: 12px; color: #999;">Вывод потребителей на оптовый рынок</div>
    </div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <button onclick="saveAllData()">💾 Сохранить</button>
      <button onclick="refreshDataFromServer()">↻ Обновить</button>
      <div class="sync-indicator" id="syncStatus">
        <span class="sync-offline">⊘ Offline</span>
      </div>
    </div>
  </div>

  <div class="companies-tabs">
    <button class="tab active" onclick="selectCompany('ССК-Урал')">ССК-Урал</button>
    <button class="tab" onclick="selectCompany('ССК-Центр')">ССК-Центр</button>
    <button class="tab" onclick="selectCompany('ССК-Инвест')">ССК-Инвест</button>
  </div>

  <div id="projectsContainer" class="cards-grid">
    <!-- Карточки проектов вставятся сюда -->
  </div>
</div>

<div id="flashHint" class="flash-hint" style="display: none;"></div>

<script>
// ===== SUPABASE КОНФИГУРАЦИЯ =====
const SUPABASE_URL = 'https://agfricsrecfegkkyzgbb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eVY92lWEDEq7rfGb2GB73w_0fxE0fgh';

let supabaseClient = null;
let syncStatus = 'offline';
let state = {
  projects: [],
  activeCompany: 'ССК-Урал'
};

// ===== ИНИЦИАЛИЗАЦИЯ SUPABASE =====
function initSupabase() {
  if (SUPABASE_URL && SUPABASE_KEY && !SUPABASE_URL.includes('YOUR_PROJECT')) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    console.log('✓ Supabase инициализирован');
    setSyncStatus('synced');
    loadDataFromSupabase();
  } else {
    console.warn('⚠ Supabase ключи не настроены');
    setSyncStatus('offline');
    loadSampleData();
  }
}

// ===== УПРАВЛЕНИЕ СТАТУСОМ СИНХРОНИЗАЦИИ =====
function setSyncStatus(status) {
  syncStatus = status;
  const indicator = document.getElementById('syncStatus');
  const statusMap = {
    'offline': { text: '⊘ Offline', class: 'sync-offline' },
    'syncing': { text: '↻ Синхронизирую...', class: 'sync-syncing' },
    'synced': { text: '✓ Синхронизировано', class: 'sync-online' }
  };
  const s = statusMap[status];
  indicator.innerHTML = `<span class="${s.class}">${s.text}</span>`;
}

// ===== ЗАГРУЗКА ДАННЫХ ИЗ SUPABASE =====
async function loadDataFromSupabase() {
  if (!supabaseClient) return;
  try {
    setSyncStatus('syncing');
    const { data, error } = await supabaseClient.from('projects').select('*');
    if (error) throw error;
    state.projects = data || [];
    setSyncStatus('synced');
    showFlash('✓ Данные загружены с сервера');
    render();
  } catch(e) {
    console.error('Ошибка Supabase:', e);
    setSyncStatus('offline');
    loadSampleData();
  }
}

// ===== СОХРАНЕНИЕ ДАННЫХ В SUPABASE =====
async function saveAllData() {
  if (!supabaseClient) {
    showFlash('Supabase не подключен, сохраняю локально');
    return;
  }
  try {
    setSyncStatus('syncing');
    const { error } = await supabaseClient.from('projects').upsert(state.projects, { onConflict: 'id' });
    if (error) throw error;
    setSyncStatus('synced');
    showFlash('✓ Сохранено на сервер');
  } catch(e) {
    console.error('Ошибка при сохранении:', e);
    setSyncStatus('offline');
    showFlash('❌ Ошибка сохранения');
  }
}

// ===== ОБНОВЛЕНИЕ ДАННЫХ С СЕРВЕРА =====
async function refreshDataFromServer() {
  if (!supabaseClient) {
    showFlash('Supabase не подключен');
    return;
  }
  await loadDataFromSupabase();
}

// ===== ПРИМЕР ДАННЫХ =====
function loadSampleData() {
  state.projects = [
    {
      id: '1',
      company: 'ССК-Урал',
      name: 'Объект ОРЭМ 1',
      status: 'on_orem',
      code: 'ГТП-001',
      psi: '12345'
    },
    {
      id: '2',
      company: 'ССК-Центр',
      name: 'Объект ОРЭМ 2',
      status: 'in_process',
      name: 'Объект в процессе'
    }
  ];
  render();
}

// ===== ВЫБОР КОМПАНИИ =====
function selectCompany(company) {
  state.activeCompany = company;
  document.querySelectorAll('.tab').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

// ===== РЕНДЕРИНГ =====
function render() {
  const container = document.getElementById('projectsContainer');
  const filtered = state.projects.filter(p => p.company === state.activeCompany);
  container.innerHTML = filtered.map(p => `
    <div class="card">
      <div class="card-title">${p.name}</div>
      <div class="card-status">Компания: ${p.company}</div>
      <div class="card-status">Статус: ${p.status === 'on_orem' ? 'На ОРЭМ' : 'В процессе'}</div>
      ${p.code ? `<div class="card-status">Код: ${p.code}</div>` : ''}
    </div>
  `).join('');
}

// ===== УВЕДОМЛЕНИЯ =====
function showFlash(text) {
  const hint = document.getElementById('flashHint');
  hint.textContent = text;
  hint.style.display = 'block';
  setTimeout(() => hint.style.display = 'none', 3000);
}

// ===== ЗАПУСК ПРИ ЗАГРУЗКЕ =====
document.addEventListener('DOMContentLoaded', () => {
  console.log('🚀 Запуск дашборда...');
  initSupabase();
});
</script>

</body>
</html>
